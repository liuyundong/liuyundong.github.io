<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开心</title>
  <style>
    :root {
      --ink: #f4f7ed;
      --muted: #9ca698;
      --line: rgba(244, 247, 237, 0.13);
      --panel: rgba(17, 25, 22, 0.78);
      --lime: #f5d76e;
      --mint: #66e0a3;
      --coral: #ff8167;
      --night: #17100d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--night);
      font-family: 'Trebuchet MS', sans-serif;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background:
        linear-gradient(120deg, rgba(245, 215, 110, .08), transparent 38%),
        radial-gradient(circle at 82% 15%, rgba(102, 224, 163, .12), transparent 25%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.012) 4px);
    }
    .shell {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 44px;
      position: relative;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 26px;
    }
    .eyebrow {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--lime);
      font: 500 11px/1 'Courier New', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .eyebrow::before { content: ''; width: 28px; height: 2px; background: var(--lime); }
    h1 { margin: 0; color: var(--lime); font-size: clamp(1.6rem, 4vw, 2.5rem); line-height: 1; letter-spacing: -.05em; font-weight: 600; }
    .tagline { max-width: 220px; color: var(--muted); font-size: 14px; line-height: 1.45; text-align: right; margin: 0 0 3px; }
    .game-layout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; align-items: start; }
    .stage { padding: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 20px 70px rgba(0,0,0,.26); }
    .stage-top { display: flex; justify-content: space-between; align-items: center; padding: 2px 3px 13px; color: var(--muted); font: 11px 'Courier New', monospace; letter-spacing: .06em; text-transform: uppercase; }
    .status { display: flex; align-items: center; gap: 7px; }
    .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); }
    .status.paused::before { background: var(--coral); box-shadow: 0 0 12px var(--coral); }
    .canvas-wrap { position: relative; width: 100%; aspect-ratio: 1; background: #101a16; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(7, 12, 11, .68); text-align: center; transition: opacity .2s; }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay-box { max-width: 310px; }
    .overlay h2 { margin: 0 0 9px; font-size: 28px; letter-spacing: -.05em; }
    .overlay p { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    button { border: 0; color: #101510; background: var(--lime); font: 600 13px 'Trebuchet MS', sans-serif; cursor: pointer; transition: transform .15s, filter .15s; }
    button:hover { filter: brightness(1.08); transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    .primary { padding: 12px 20px; }
    .side { display: grid; gap: 18px; }
    .panel { border-top: 1px solid var(--line); padding-top: 15px; }
    .panel-label { color: var(--muted); font: 11px 'Courier New', monospace; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }
    .score-row { display: flex; align-items: end; justify-content: space-between; }
    .score { color: var(--lime); font: 500 clamp(2.4rem, 6vw, 3.7rem)/.9 'Courier New', monospace; letter-spacing: -.12em; }
    .best { color: var(--muted); font: 12px 'Courier New', monospace; }
    .best strong { display: block; color: var(--ink); font-size: 19px; margin-top: 3px; font-weight: 400; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .fact { padding: 12px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
    .fact strong { display: block; color: var(--mint); font: 500 18px 'Courier New', monospace; margin-top: 5px; }
    .actions { display: flex; gap: 9px; }
    .action { flex: 1; min-height: 40px; color: var(--ink); background: transparent; border: 1px solid var(--line); }
    .action:hover { border-color: var(--lime); }
    .controls { color: var(--muted); font-size: 13px; line-height: 1.8; }
    kbd { display: inline-grid; place-items: center; min-width: 25px; height: 23px; margin-right: 4px; border: 1px solid var(--line); color: var(--ink); font: 11px 'Courier New', monospace; }
    .touch-controls { display: none; grid-template-columns: repeat(3, 44px); justify-content: center; gap: 7px; margin-top: 14px; }
    .touch-controls button { width: 44px; height: 38px; font-size: 18px; }
    .touch-controls button:nth-child(1) { grid-column: 2; }
    .touch-controls button:nth-child(2) { grid-column: 1; grid-row: 2; }
    .touch-controls button:nth-child(3) { grid-column: 2; grid-row: 2; }
    .touch-controls button:nth-child(4) { grid-column: 3; grid-row: 2; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 540px); padding-top: 24px; }
      header { align-items: start; margin-bottom: 20px; }
      .tagline { display: none; }
      .game-layout { display: block; }
      .side { grid-template-columns: 1fr 1fr; margin-top: 18px; gap: 20px 14px; }
      .side .panel:first-child, .side .panel:last-child { grid-column: 1 / -1; }
      .touch-controls { display: grid; }
      .stage { padding: 10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="eyebrow">Arcade / 002</div><h1>打地鼠</h1></div>
      <p class="tagline">Nine holes.<br>One very jumpy target.<br>Stay sharp.</p>
    </header>

    <section class="game-layout">
      <div class="stage">
        <div class="stage-top"><span id="status" class="status">ready</span><span>field 3 × 3</span></div>
        <div class="canvas-wrap">
          <canvas id="game" width="480" height="480" aria-label="Whack-a-mole game board"></canvas>
          <div id="overlay" class="overlay">
            <div class="overlay-box"><h2 id="overlay-title">准备好了吗？</h2><p id="overlay-copy">在地鼠缩回洞里之前点击它。你有 30 秒，尽可能多地得分。</p><button id="start-btn" class="primary">开始游戏</button></div>
          </div>
        </div>
        <div class="touch-controls" aria-label="Touch controls">
          <button data-dir="up" aria-label="Up">↑</button><button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button>
        </div>
      </div>

      <aside class="side">
        <div class="panel"><div class="panel-label">Current score</div><div class="score-row"><div id="score" class="score">000</div><div class="best">best<strong id="best">000</strong></div></div></div>
        <div class="panel"><div class="panel-label">Session stats</div><div class="facts"><div class="fact"><div class="panel-label">Time</div><strong id="time">30</strong></div><div class="fact"><div class="panel-label">Hits</div><strong id="hits">00</strong></div></div></div>
        <div class="panel actions"><button id="pause-btn" class="action">暂停</button><button id="restart-btn" class="action">重开</button></div>
        <div class="panel controls"><div class="panel-label">Controls</div><div>鼠标或触摸点击地鼠</div><div><kbd>Space</kbd> 暂停 / 继续</div></div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 3;
    const cell = canvas.width / grid;
    let mole = -1, score = 0, hits = 0, timeLeft = 30, running = false, paused = false, timer, clock;
    let best = Number(localStorage.getItem('neon-whack-best') || 0);
    const $ = (id) => document.getElementById(id);

    function reset() {
      score = 0;
      hits = 0;
      timeLeft = 30;
      mole = -1;
      paused = false;
      updateStats();
      draw();
    }
    function updateStats() {
      $('score').textContent = String(score).padStart(3, '0');
      $('best').textContent = String(best).padStart(3, '0');
      $('time').textContent = String(timeLeft).padStart(2, '0');
      $('hits').textContent = String(hits).padStart(2, '0');
    }
    function draw() {
      ctx.fillStyle = '#261813'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(245,215,110,.08)'; ctx.lineWidth = 2;
      for (let i = 1; i < grid; i++) { ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke(); }
      for (let index = 0; index < 9; index++) {
        const x = (index % grid + .5) * cell, y = (Math.floor(index / grid) + .62) * cell;
        ctx.fillStyle = '#0d0908'; ctx.beginPath(); ctx.ellipse(x, y, cell * .31, cell * .18, 0, 0, Math.PI * 2); ctx.fill();
        if (index === mole) {
          const bob = Math.sin(Date.now() / 100) * 3;
          ctx.fillStyle = '#b96947'; ctx.shadowColor = '#ff8167'; ctx.shadowBlur = 14;
          ctx.beginPath(); ctx.arc(x, y - cell * .18 + bob, cell * .22, Math.PI, 0); ctx.lineTo(x + cell * .22, y - cell * .18 + bob); ctx.arc(x, y - cell * .18 + bob, cell * .22, 0, Math.PI); ctx.fill(); ctx.shadowBlur = 0;
          ctx.fillStyle = '#17100d'; ctx.beginPath(); ctx.arc(x - 18, y - cell * .2 + bob, 4, 0, Math.PI * 2); ctx.arc(x + 18, y - cell * .2 + bob, 4, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    function showMole() {
      if (!running || paused) return;
      mole = Math.floor(Math.random() * 9);
      draw();
      clearTimeout(timer);
      timer = setTimeout(showMole, Math.max(430, 850 - score * 12));
    }
    function start() { reset(); running = true; $('overlay').classList.add('hidden'); $('status').textContent = 'running'; $('status').classList.remove('paused'); $('pause-btn').textContent = '暂停'; showMole(); clearInterval(clock); clock = setInterval(() => { if (!paused) { timeLeft--; updateStats(); if (timeLeft <= 0) endGame(); } }, 1000); }
    function endGame() { running = false; clearTimeout(timer); clearInterval(clock); mole = -1; draw(); $('overlay-title').textContent = '时间到！'; $('overlay-copy').textContent = `你敲中了 ${score} 只地鼠，准备再来一局吗？`; $('start-btn').textContent = '再玩一次'; $('overlay').classList.remove('hidden'); $('status').textContent = 'game over'; }
    function togglePause() { if (!running) return; paused = !paused; $('status').textContent = paused ? 'paused' : 'running'; $('status').classList.toggle('paused', paused); $('pause-btn').textContent = paused ? '继续' : '暂停'; if (!paused) showMole(); }
    function whack(event) { if (!running || paused || mole < 0) return; const rect = canvas.getBoundingClientRect(); const x = Math.floor((event.clientX - rect.left) / rect.width * grid); const y = Math.floor((event.clientY - rect.top) / rect.height * grid); if (y * grid + x === mole) { score++; hits++; if (score > best) { best = score; localStorage.setItem('neon-whack-best', best); } mole = -1; updateStats(); draw(); clearTimeout(timer); timer = setTimeout(showMole, 160); } }

    document.addEventListener('keydown', (event) => { if (event.code === 'Space') { event.preventDefault(); togglePause(); } });
    canvas.addEventListener('click', whack);
    $('start-btn').addEventListener('click', start); $('restart-btn').addEventListener('click', start); $('pause-btn').addEventListener('click', togglePause);
    reset();
    setInterval(() => { if (running && !paused) draw(); }, 120);
  </script>
</body>
</html>
